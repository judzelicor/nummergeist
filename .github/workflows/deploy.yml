name: Build & Deploy Nummergeist

on:
  push:
    branches: [mother]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name : Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"

          RELEASE="release-$(date + %s)"
          TARGET="/var/www/nummergeist.judzelicor.com/releases/$RELEASE"

          # Create release directory
          ssh $SSH_OPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p $TARGET"

          # Upload build artifacts
          rsync -az --delete -e "ssh $SSH_OPTS" dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$TARGET/

          # Atomic symlink swap
          ssh $SSH_OPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            ln -sfn $TARGET /var/www/nummergeist.judzelicor.com/current_tmp && \
            mv -Tf /var/www/nummergeist.judzelicor.com/current_tmp /var/www/nummergeist.judzelicor.com/current"

          # Keep only last 5 releases
          ssh $SSH_OPTS ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            cd /var/www/nummergeist.judzelicor.com/releases && \
            ls -t | tail -n +6 | xargs -r rm -rf"